<!DOCTYPE html>
<!-- data-theme is named here, statically. The consumer app reads the stored
     room through src/lib/accounts.ts; the board deliberately does not import
     that module, because it drags the whole account layer into a bundle that
     has no accounts. Any of the six rooms in src/index.css may be named here. -->
<html lang="en" data-theme="dyehouse">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almari — alpha monitor</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- No manifest, no theme-color, no apple-touch-icon, no service worker.
         This is a board, not an installable app, and it must never be answered
         from a cached yesterday. -->
  </head>
  <body>
    <div id="portal-root"></div>
    <script type="module" src="/src/portal/main.tsx"></script>
  </body>
</html>
