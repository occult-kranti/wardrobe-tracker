name: Deploy to GitHub Pages

# Publishes by pushing the built site to the gh-pages branch, which Pages
# serves (Settings → Pages → Source: "Deploy from a branch" / gh-pages).
#
# Why not actions/deploy-pages: the repo's github-pages environment carries a
# deployment-branch policy that allows only gh-pages, so artifact deploys from
# main are rejected ("Branch 'main' is not allowed to deploy to github-pages").
# Changing that needs repo-admin in the UI; pushing to gh-pages does not. If the
# environment is ever opened up (Settings → Environments → github-pages →
# Deployment branches → add main, and Settings → Pages → Source → GitHub
# Actions), this can go back to the artifact flow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Browsers are only needed for the smoke/screenshot harnesses, not the build.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run lint
      - run: npm run test:migrate
      - run: npm run test:demo
      - run: npm run test:intake
      - run: npm run build
      # The mobile design pack ships beside the app at /mobile_version_v1/.
      - run: node scripts/build-mobile-gallery.mjs
      # The team boards ship at /company/; the company PLAN PAGE deliberately
      # does not. company/index.html carries the trademark position, the rename
      # gate and the budgets, and it is the one file here that reads as an
      # opponent's opening paragraph. Copy files by name, never the folder, so
      # adding a document to company/ can never publish it by accident.
      - name: Copy the team boards into dist/company
        run: |
          set -eu
          mkdir -p dist/company
          cp company/almari.css company/board.css company/board.js dist/company/
          cp company/tracker.html company/tracker.js dist/company/
          cp company/build.html company/build.js dist/company/
          cp company/ship.html dist/company/
          # Both boards are dead without the shared engine and unreadable
          # without the shared stylesheet; fail loudly rather than publishing
          # two pages that load and then do nothing, or do it unstyled.
          test -f dist/company/board.js
          test -f dist/company/board.css
      # V2 lives on its own branch and is served under /v2/. It builds with
      # base './' so it can sit at any subpath. Building it here means every
      # deploy of main re-publishes v2 alongside it — before this step, any
      # push to main force-pushed gh-pages WITHOUT /v2/ and silently took the
      # second site down.
      - uses: actions/checkout@v4
        with:
          ref: v2
          path: v2
      - name: Build v2 into dist/v2
        run: |
          set -eu
          cd v2
          npm ci
          npm run build
          mkdir -p ../dist/v2
          cp -r dist/. ../dist/v2/
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Push dist to gh-pages
        run: |
          set -eu
          touch dist/.nojekyll
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
